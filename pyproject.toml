[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="leak-detector-mvp"
version="0.1.0"
requires-python=">=3.10"

[project.optional-dependencies]
dev=["pytest>=8"]
browser=["playwright>=1.40"]

[project.scripts]
leak-detector-scan="leak_detector.cli:scan_cmd"
leak-detector-observe="leak_detector.cli:observe_cmd"
leak-detector-audit="leak_detector.cli:audit_cmd"
leak-detector-propose="leak_detector.cli:propose_cmd"

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
