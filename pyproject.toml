[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="leak-detector-mvp"
version="0.1.0"
description="Revenue Recovery Sprint tooling for independent residential HVAC contractors — scan, audit, and propose a $997 evidence-backed fix for a specific revenue leak."
readme="README.md"
requires-python=">=3.10"
license={file="LICENSE"}
authors=[{name="Keith Tortorich"}]

# The default (fallback) scan/audit/propose path uses only the Python
# standard library — no runtime dependencies are required to install or
# run it. The optional `browser` extra below adds Playwright for
# `leak-detector-observe`'s in-browser checks.
dependencies=[]

[project.urls]
Repository="https://github.com/keithtortorich/RRA-MVP"

[project.optional-dependencies]
dev=["pytest>=8"]
browser=["playwright>=1.40"]

[project.scripts]
leak-detector-scan="leak_detector.cli:scan_cmd"
leak-detector-observe="leak_detector.cli:observe_cmd"
leak-detector-audit="leak_detector.cli:audit_cmd"
leak-detector-propose="leak_detector.cli:propose_cmd"
leak-detector-patterns="leak_detector.cli:patterns_cmd"

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
