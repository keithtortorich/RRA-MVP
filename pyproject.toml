[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="rra-mvp"
version="0.1.0"
requires-python=">=3.10"

[project.optional-dependencies]
dev=["pytest>=8"]
browser=["playwright>=1.40"]

[project.scripts]
revenue-scan="rra.cli:scan_cmd"
revenue-observe="rra.cli:observe_cmd"
revenue-audit="rra.cli:audit_cmd"
revenue-propose="rra.cli:propose_cmd"

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
